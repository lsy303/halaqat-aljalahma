<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الطلاب · حلقات جامع يوسف بن شاهين الجلاهمة</title>
<meta name="theme-color" content="#1E253F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حلقات الجلاهمة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy masthead carrying the mosque logo, then a single reading column of
   cards (announcements, monthly knights, weekly roll). Copper is reserved for honours:
   prizes, knights, and the active state. */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --sunk:#EDEBE5; --ink:#1E253F; --muted:#666B7C; --line:#E0DCD2;
  --navy:#1E253F; --navy-ink:#F3EFE7; --navy-muted:#AEB3C6;
  --copper:#A47142; --copper-deep:#895331; --copper-soft:#F4EADF; --on-copper:#FFFFFF;
  --ok:#2C7A56; --ok-soft:#E2F0E8; --bad:#AE4538; --bad-soft:#F7E5E1; --warn:#9A6A0C; --warn-soft:#FBEFD3;
  --title:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --display:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10152A; --surface:#181E34; --sunk:#141A2E; --ink:#ECE8DF; --muted:#9DA2B4; --line:#2A3150;
  --navy:#0B0F20; --navy-ink:#F3EFE7; --navy-muted:#9DA2B4;
  --copper:#C58E59; --copper-deep:#A8733F; --copper-soft:#2C2622; --on-copper:#1A1209;
  --ok:#62BE90; --ok-soft:#16302A; --bad:#E07B6D; --bad-soft:#3A1F24; --warn:#E3B453; --warn-soft:#382D14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10152A; --surface:#181E34; --sunk:#141A2E; --ink:#ECE8DF; --muted:#9DA2B4; --line:#2A3150;
  --navy:#0B0F20; --navy-ink:#F3EFE7; --navy-muted:#9DA2B4;
  --copper:#C58E59; --copper-deep:#A8733F; --copper-soft:#2C2622; --on-copper:#1A1209;
  --ok:#62BE90; --ok-soft:#16302A; --bad:#E07B6D; --bad-soft:#3A1F24; --warn:#E3B453; --warn-soft:#382D14; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Masthead */
.mast{background:var(--navy);color:var(--navy-ink);position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--copper-deep),var(--copper),var(--copper-deep))}
.mast-in{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 22px;display:flex;gap:18px;align-items:center}
.logo{flex:none;width:74px}
.logo svg{display:block;width:100%;height:auto}
.mast-txt{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.02em;color:var(--navy-muted)}
.mast h1{font-family:var(--title);font-weight:700;font-size:clamp(24px,6vw,32px);line-height:1.25;margin:2px 0 6px;text-wrap:balance}
.week{font-size:13px;color:var(--navy-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.week b{color:var(--navy-ink);font-weight:600}
.mast-act{align-self:flex-start;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--navy-ink);border-radius:10px;height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.icon-btn:hover{border-color:var(--copper)}
.icon-btn svg{width:16px;height:16px}
.wk-nav{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--navy-ink);border-radius:8px;width:30px;height:28px;display:inline-grid;place-items:center}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}

.demo{font-size:12.5px;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.tbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--copper-soft);border:1px solid var(--copper);border-radius:10px;padding:8px 12px;font-size:13px}
.tbar b{color:var(--copper-deep)}
:root[data-theme="dark"] .tbar b{color:var(--copper)}
.tbar .sp{flex:1}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;margin:0 0 10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.sec-h small{color:var(--muted);font-size:12.5px}

/* Announcements */
.ann-list{display:flex;flex-direction:column;gap:8px}
.ann{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--copper);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.ann p{margin:0;flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ann time{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.add-btn{border:1px dashed var(--copper);background:transparent;color:var(--copper);border-radius:10px;padding:8px 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.x{background:transparent;border:0;color:var(--muted);width:28px;height:28px;border-radius:8px;flex:none}
.x:hover{background:var(--sunk);color:var(--bad)}

/* Knights */
.knights{background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}
.knights .k{min-width:0}
.knights .k-lbl{font-family:var(--display);color:var(--copper);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.knights .k-lbl svg{width:18px;height:18px}
.knights .k-names{font-weight:600;font-size:15px;margin-top:4px;line-height:1.5}
.knights .k-names span{display:block}
.knights .k-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:8px}
.knights .k-head h2{font-family:var(--display);margin:0;font-size:18px;font-weight:600}
.knights .k-head small{color:var(--navy-muted)}
.k-empty{color:var(--navy-muted);font-size:13px}

/* Roll table */
.roll-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.roll{width:100%;border-collapse:collapse}
.roll th{font-size:12px;font-weight:600;color:var(--muted);padding:10px 4px;border-bottom:1px solid var(--line);background:var(--sunk);text-align:center;line-height:1.3}
.roll th:first-child{text-align:start;padding-inline-start:14px}
.roll th .d{display:block;font-weight:400;font-size:11px}
.roll th.today{color:var(--copper-deep)}
:root[data-theme="dark"] .roll th.today{color:var(--copper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .roll th.today{color:var(--copper)}}
.roll td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;vertical-align:middle}
.roll tr:last-child td{border-bottom:0}
.roll td.nm{text-align:start;padding-inline-start:14px}
.nm-btn{background:none;border:0;padding:4px 0;text-align:start;font-weight:600;font-size:14.5px;line-height:1.4;display:flex;align-items:center;gap:6px}
.nm-btn:hover{color:var(--copper)}
.nm-btn .chev{color:var(--muted);flex:none;width:14px;height:14px}
.cell{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;position:relative;font-weight:700;font-size:16px}
.cell.p{background:var(--ok-soft);color:var(--ok)}
.cell.a{background:var(--bad-soft);color:var(--bad)}
.cell.q{background:var(--warn-soft);color:var(--warn)}
.cell.n{color:var(--line)}
.cell.f{color:var(--line);opacity:.6}
.cell.edit{border-color:var(--line);cursor:pointer}
.cell.edit:hover{border-color:var(--copper)}
.cell.rec{background:var(--copper-soft);color:var(--copper-deep)}
:root[data-theme="dark"] .cell.rec{color:var(--copper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cell.rec{color:var(--copper)}}
.cell svg{width:18px;height:18px}
.coin{position:absolute;top:-5px;inset-inline-end:-5px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--copper),var(--copper-deep));color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface);font-family:var(--display);line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-style:normal;font-weight:700;font-size:11px}
.legend .coin{position:static;box-shadow:none}
.coin svg{width:66%;height:66%;display:block}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--copper)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.cop{background:linear-gradient(135deg,var(--copper),var(--copper-deep));color:#fff;border:0}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.back{background:none;border:0;color:var(--navy-ink);display:inline-flex;align-items:center;gap:6px;padding:0;font-size:13px;opacity:.85}
.back svg{width:16px;height:16px}

/* Student page */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.tile .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.tile.hl{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.tile.hl .l{color:var(--navy-muted)}
.tile.hl .v{color:var(--copper)}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.log{display:flex;flex-direction:column}
.log-day{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.log-day:last-child{border-bottom:0}
.log-date b{display:block;font-size:14px}
.log-date span{font-size:12px;color:var(--muted)}
.log-body{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.log-body .ln{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.log-body .k{font-size:12px;color:var(--muted);width:46px;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.pill.p{background:var(--ok-soft);color:var(--ok)}
.pill.a{background:var(--bad-soft);color:var(--bad)}
.pill.c{background:var(--copper-soft);color:var(--copper-deep)}
:root[data-theme="dark"] .pill.c{color:var(--copper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.c{color:var(--copper)}}
.pg{color:var(--copper-deep);font-weight:600}
:root[data-theme="dark"] .pg{color:var(--copper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pg{color:var(--copper)}}
.fees{display:flex;flex-wrap:wrap;gap:8px}
.fee{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center;background:var(--surface)}
.fee.paid{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.fee.due{color:var(--bad);border-color:var(--bad-soft)}
.fee svg{width:16px;height:16px;flex:none}
.fee-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px;padding:9px 14px;font-size:14px}
.fee-strip.fs-paid{background:var(--ok-soft);color:var(--ok)}
.fee-strip.fs-due{background:var(--bad-soft);color:var(--bad)}
.fee-strip svg{width:24px;height:24px;flex:none}
.fee-strip span{font-size:12.5px;margin-inline-start:auto}
.fee-now{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px}
.fee-now.paid{background:var(--ok-soft);color:var(--ok)}
.fee-now.due{background:var(--bad-soft);color:var(--bad)}
.fee-now svg{width:38px;height:38px;flex:none}
.fee-now b{display:block;font-size:16px}
.fee-now span{font-size:13px}
.fee-card{display:flex;flex-direction:column;gap:12px}
.fee-card h2 svg{width:22px;height:22px;color:var(--copper);vertical-align:-4px;margin-inline-end:6px}
.knights-me{display:flex;flex-direction:column;gap:8px}
.knight{background:linear-gradient(135deg,var(--copper),var(--copper-deep));color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px}
.knight svg{width:34px;height:34px;flex:none}
.knight b{display:block;font-size:17px}
.knight span{font-size:13px;opacity:.92}

/* Teacher */
.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;scrollbar-width:none}
.tabs button{flex:none;border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--navy);color:var(--navy-ink)}
details.st{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.st[open]{border-color:var(--copper)}
details.st summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
details.st summary::-webkit-details-marker{display:none}
details.st summary .n{flex:1;min-width:0;font-weight:600}
details.st summary .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.st-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.fld{display:grid;grid-template-columns:1fr;gap:6px}
.fld > label{font-size:12.5px;color:var(--muted);font-weight:600}
.rec-row{display:grid;grid-template-columns:minmax(0,1.4fr) 64px 64px;gap:8px;align-items:center}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:14px}
.inp:disabled{opacity:.5}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.chk input{accent-color:var(--copper);width:16px;height:16px}
.calc{font-size:13px;color:var(--muted)}
.done-btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.done-btn.on{background:var(--copper-soft);border-color:var(--copper);color:var(--copper-deep)}
:root[data-theme="dark"] .done-btn.on{color:var(--copper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done-btn.on{color:var(--copper)}}
.list{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chip.won{opacity:.45;text-decoration:line-through}
.wheel-box{display:grid;place-items:center;position:relative;padding:6px 0}
.wheel-box canvas{width:min(320px,100%);height:auto;aspect-ratio:1;max-width:100%}
.ptr{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-inline:13px solid transparent;border-top:22px solid var(--copper);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.winners{display:flex;flex-direction:column;gap:6px}
.win{display:flex;align-items:center;gap:10px;background:var(--copper-soft);border-radius:10px;padding:8px 12px}
.win .coin{position:static;box-shadow:none;width:24px;height:24px;font-size:12px}
.win b{flex:1}
.fee-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.fee-tbl{border-collapse:collapse;min-width:640px;width:100%}
.fee-tbl th,.fee-tbl td{padding:6px;border-bottom:1px solid var(--line);text-align:center;font-size:13px}
.fee-tbl th{background:var(--sunk);color:var(--muted);font-weight:600}
.fee-tbl td:first-child,.fee-tbl th:first-child{text-align:start;padding-inline-start:12px;position:sticky;inset-inline-start:0;background:var(--surface);white-space:nowrap}
.fee-tbl th:first-child{background:var(--sunk)}
.fbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:inline-grid;place-items:center}
.fbtn.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.fbtn svg{width:16px;height:16px}
.stu-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 32px;gap:8px;align-items:center}
.stu-row .delc{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:9px;padding:8px 10px;font-size:13px}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.add-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

/* Modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,13,26,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--copper)}
.dlg h3{font-family:var(--display);margin:0;font-size:20px;font-weight:600}
.dlg p{margin:0;color:var(--muted);font-size:14px}
.pin{letter-spacing:.3em;text-align:center;font-size:20px;direction:ltr}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.prize-big{display:grid;place-items:center;gap:8px;text-align:center;padding:6px 0}
.prize-big .coin{position:static;width:64px;height:64px;font-size:28px;box-shadow:0 0 0 6px var(--copper-soft)}
.prize-big b{font-family:var(--display);font-size:22px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.ann img{display:block;width:100%;max-height:440px;object-fit:cover;border-radius:8px;margin-top:8px}
.ann-prev{display:block;max-width:100%;max-height:220px;border-radius:8px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,13,26,.5);z-index:25}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(360px,88vw);background:var(--bg);z-index:26;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:8px 0 30px rgba(0,0,0,.25);animation:din .22s ease-out}
@keyframes din{from{transform:translateX(-100%)}to{transform:none}}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dr-head h2{font-family:var(--display);margin:0;font-size:21px;font-weight:600}
.dr-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dr-sec h3{margin:0;font-size:16px;font-family:var(--display);font-weight:600;display:flex;align-items:center;gap:8px}
.dr-sec h3 svg{width:20px;height:20px;color:var(--copper)}
.contact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.contact:first-of-type{border-top:0;padding-top:0}
.contact .who{flex:1;min-width:0}
.contact .who b{display:block;font-size:14px}
.contact .ph{direction:ltr;unicode-bidi:isolate;font-size:15px;user-select:all;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px;text-decoration:none;color:var(--ink)}
.wa{background:#1F8F54;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 14px;font-weight:600}
.wa svg{width:20px;height:20px}
.rules{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.7}
.rules li::marker{color:var(--copper)}
.ct-row{display:grid;grid-template-columns:minmax(0,1fr) 128px 32px;gap:8px;align-items:center}
.due{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.due.next{border:1px dashed var(--copper)}
.due-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.due-h b{font-size:14px}
.lnk{background:none;border:0;color:var(--copper);font-weight:600;font-size:13px;padding:0}
.hw{background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--copper)}
.hw h2{font-family:var(--display);margin:0;font-size:19px;font-weight:600}
.hw .log-body .k{color:var(--navy-muted)}
.hw .pg{color:var(--copper)}
.hw .log-body{font-size:15px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.1);color:var(--navy-ink)}
.sync i{width:8px;height:8px;border-radius:50%;background:#62BE90;display:inline-block}
.sync.pending i{background:#E3B453}
.sync.err i{background:#E07B6D}
.err.ok{color:var(--ok)}
.no{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:6px;background:var(--sunk);color:var(--muted);font-size:12px;font-weight:600;margin-inline-end:8px;flex:none;vertical-align:middle}
.rec-item{display:flex;flex-direction:column;gap:6px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.rec-item:last-of-type{border-bottom:0;padding-bottom:0}
.stu-row{grid-template-columns:24px minmax(0,1fr) 124px 32px}
.par-tbl{min-width:520px}
.par-tbl td:nth-child(2){white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv>span{color:var(--muted)}
.kv-notes{flex-direction:column;gap:4px}
.kv-notes p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.iban{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.iban span{font-weight:600;letter-spacing:.04em;font-size:15px;overflow-wrap:anywhere;min-width:0}
.car{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.slide{display:none;margin:0}
.slide.on{display:block;animation:fadein .5s ease}
@keyframes fadein{from{opacity:.25}to{opacity:1}}
.slide img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sunk)}
.slide figcaption{padding:12px 16px 36px;display:flex;flex-direction:column;gap:4px;position:relative}
.slide figcaption p{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.slide.txt figcaption{padding:24px 18px 40px;border-inline-start:4px solid var(--copper);min-height:132px;justify-content:center}
.slide.txt figcaption p{font-size:17px;font-weight:500}
.car:not([data-n="1"]) .slide.txt figcaption{padding-inline:54px}
.slide time{font-size:12px;color:var(--muted)}
.slide .x{position:absolute;top:8px;inset-inline-end:8px;background:var(--surface)}
.slide.has-img .x{top:-44px}
.car-nav{position:absolute;top:calc(42% - 18px);width:36px;height:36px;border-radius:50%;border:0;background:rgba(30,37,63,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.car-nav svg{width:18px;height:18px}
.car-nav.prev{inset-inline-start:8px}
.car-nav.next{inset-inline-end:8px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);cursor:pointer;transition:width .2s}
.dot.on{background:var(--copper);width:20px}
.fee-strip.fs-warn{background:var(--warn-soft);color:var(--warn)}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px 16px;align-items:start;position:relative;overflow:hidden}
.profile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--copper-deep),var(--copper))}
.avatar{width:92px;height:92px;border-radius:50%;background:var(--navy);color:var(--copper);display:grid;place-items:center;font-family:var(--title);font-size:34px;font-weight:700;position:relative;overflow:visible;box-shadow:0 0 0 3px var(--copper-soft)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av-edit{position:absolute;bottom:-2px;inset-inline-start:-2px;width:32px;height:32px;border-radius:50%;background:var(--copper);color:#fff;display:grid;place-items:center;cursor:pointer;border:2px solid var(--surface)}
.av-edit svg{width:16px;height:16px}
.pf-main{min-width:0;display:flex;flex-direction:column;gap:8px}
.pf-main h2{margin:2px 0 0;font-size:18px;line-height:1.4;text-wrap:balance}
.pf-grid{display:grid;grid-template-columns:1fr;gap:6px}
.pf-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.pf-row>span{color:var(--muted);font-size:12.5px}
.pf-row b{overflow-wrap:anywhere}
.pf-row .inp{padding:6px 10px;font-size:14px}
.pf-notes{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pf-notes>span{color:var(--muted);font-size:12.5px}
.pf-notes p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:420px){.profile{grid-template-columns:76px minmax(0,1fr)}.avatar{width:76px;height:76px;font-size:28px}.pf-row{grid-template-columns:1fr;gap:2px}}
.note-in{font-size:13.5px}
.rep-tbl{min-width:620px}
.rep-tbl td,.rep-tbl th{white-space:nowrap}
.rep-tbl td:first-child{white-space:normal;min-width:160px}
.term-card{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.term-card>div{background:var(--sunk);border-radius:10px;padding:8px 10px;text-align:center}
.term-card b{display:block;font-size:18px}
.term-card span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.term-card{grid-template-columns:repeat(2,1fr)}}
.print-only{display:none}
.alb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.alb-card{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;border:0;padding:0;background:var(--navy);cursor:pointer;display:block;width:100%}
.alb-card img{width:100%;height:100%;object-fit:cover;display:block}
.alb-card span{position:absolute;inset:auto 0 0 0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(10,13,26,.85));color:#fff;font-weight:600;font-size:13.5px;text-align:start;line-height:1.35}
.alb-card span small{display:block;font-weight:400;font-size:11.5px;opacity:.85}
.alb-card .alb-ic{position:absolute;top:8px;inset-inline-start:8px;width:28px;height:28px;border-radius:8px;background:rgba(10,13,26,.55);color:#fff;display:grid;place-items:center;padding:0}
.alb-card .alb-ic svg{width:16px;height:16px}
.slide-link{color:var(--copper);font-size:13px;font-weight:600}
.grid-tbl{min-width:0}
.grid-tbl td,.grid-tbl th{padding:4px 3px}
.gc{display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:6px;font-size:11px;font-weight:700;color:var(--line)}
.gc.p{background:var(--ok-soft);color:var(--ok)}
.gc.q{background:var(--warn-soft);color:var(--warn)}
.gc.a{background:var(--bad-soft);color:var(--bad)}
.rep-dates{display:flex;gap:8px;flex-wrap:wrap}
.rep-dates label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rep-dates .inp{width:auto}
@media print{.grid-tbl{font-size:10px}.gc{min-width:16px;height:16px}}
.gal-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gal-strip button,.gal-grid button{padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--sunk);cursor:pointer;display:block;width:100%}
.gal-strip img,.gal-grid img{width:100%;height:100%;object-fit:cover;display:block}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.album{display:flex;flex-direction:column;gap:8px}
.album h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.album h3 small{color:var(--muted);font-weight:400;font-size:12.5px}
.lb{position:fixed;inset:0;background:rgba(8,10,20,.92);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
.lb img{max-width:100%;max-height:72vh;border-radius:10px;object-fit:contain}
.lb .cap{color:#fff;text-align:center;font-size:14px;max-width:640px}
.lb .cap small{display:block;color:#AEB3C6;font-size:12px}
.lb .lb-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lb .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
@media print{
  body{background:#fff!important;color:#000}
  .mast,.tabs,.tbar,.no-print,#toast,#drawer,.row>.btn,button{display:none!important}
  .print-only{display:block!important}
  .wrap{max-width:none;padding:0}
  .card,.fee-tbl-wrap{border:0!important;box-shadow:none!important}
  .fee-tbl-wrap{overflow:visible!important}
  .rep-tbl{min-width:0}
}
.pw-wrap{position:relative;display:block}
.pw-wrap .inp{padding-inline-end:46px;width:100%}
.pw-wrap[dir="ltr"] .inp{padding-inline-end:46px}
.eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:grid;place-items:center;cursor:pointer}
.eye:hover{color:var(--copper);background:var(--sunk)}
.eye svg{width:20px;height:20px}
.loading{display:grid;place-items:center;gap:12px;padding:60px 16px;color:var(--muted);text-align:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--copper);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<div id="app"></div>
<div id="modal"></div>
<div id="drawer"></div>
<div id="toast" class="toast" hidden></div>

/* ---------- Quran pages (Madinah mushaf, 604 pages) ---------- */
const FIRST = []; { let id = 1; for (let i = 0; i < 114; i++) { FIRST.push(id); id += Q.c[i]; } }
const P = Q.p;
function pageOf(id){ let lo=1, hi=604; while(lo<hi){ const m=(lo+hi+1)>>1; if(P[m]<=id) lo=m; else hi=m-1; } return lo; }
function rangeOf(e){
  if(!e || !e.s) return null;
  const n = Q.c[e.s-1];
  let f = e.full ? 1 : parseInt(e.f,10), t = e.full ? n : parseInt(e.t,10);
  if(!f || !t) return null;
  if(f>t) [f,t]=[t,f];
  f=Math.max(1,f); t=Math.min(n,t);
  return {f,t,n};
}
function entries(e){ return Array.isArray(e) ? e.filter(x=>x&&x.s) : (e&&e.s ? [e] : []); }
function pages1(e){
  const r = rangeOf(e); if(!r) return 0;
  const a = FIRST[e.s-1]+r.f-1, b = FIRST[e.s-1]+r.t-1;
  let sum = 0;
  for(let p=pageOf(a); p<=pageOf(b); p++){
    const st=P[p], en=P[p+1]-1;
    sum += (Math.min(b,en)-Math.max(a,st)+1)/(en-st+1);
  }
  return sum;
}
function pagesFor(e){ return entries(e).reduce((a,x)=>a+pages1(x),0); }
function fmtPages(v){
  if(!v) return "0";
  let r = Math.round(v*4)/4; if(r===0) r = .25;
  const w = Math.floor(r), fr = r-w;
  const g = fr===.25?"¼":fr===.5?"½":fr===.75?"¾":"";
  return "\u2066" + ((w? String(w):"") + g || "0") + "\u2069";
}
function recText1(e){
  const r = rangeOf(e); if(!r) return "";
  const name = Q.n[e.s-1];
  return e.full || (r.f===1 && r.t===r.n) ? `سورة ${name} كاملة` : `${name} ${r.f}–${r.t}`;
}

function recText(e){ return entries(e).map(recText1).join(" + "); }

async function uploadGallery(files){
  const album = ($("#gal-album")?.value||"").trim(), cap = ($("#gal-cap")?.value||"").trim();
  if(!album){ toast("اكتب اسم الفعالية أولاً"); $("#gal-album")?.focus(); return; }
  ui.galAlbum = album; const prog = $("#gal-prog"); let ok = 0;
  for(let i=0;i<files.length;i++){
    if(prog) prog.textContent = `جاري رفع ${i+1} من ${files.length}…`;
    try{
      const full = await compress(files[i], 1280, .72), thumb = await compress(files[i], 360, .7);
      if(full.length > 950000){ toast("صورة كبيرة جداً تم تخطيها"); continue; }
      const id = "g"+Date.now()+"_"+i, meta = {album, caption:cap, date:TODAY, ts:Date.now()+i, thumb};
      await FB.setDoc(FB.doc(FB.db,"galleryFull",id), {img:full});
      await FB.setDoc(FB.doc(FB.db,"gallery",id), meta);
      ok++;
    }catch(e){ console.error(e); }
  }
  toast(`رُفعت ${ok} صورة`); ui.album = album; loadGallery();
}

  return {dates,h,m,att,tot,pr};
}

function currentTerm(){ const m = NOW.getMonth()+1; return (m>=9 || m===1) ? "t1" : (m>=2 && m<=6) ? "t2" : "year"; }
function periodRange(p){
  const y = NOW.getMonth()>=8 ? NOW.getFullYear() : NOW.getFullYear()-1;
  if(p==="t1") return [`${y}-09-01`, `${y+1}-01-31`, "الفصل الأول"];

function rangeStats(sid, a, b){

function compress(file, max=1100, q=.78){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",q)); };
  img.onerror=()=>{ URL.revokeObjectURL(u); rej(); }; img.src=u; }); }

function wheelNames(){ return S.students.filter(s=>ui.wheelSel && ui.wheelSel.has(s.id)); }
function drawWheel(){
  const c = $("#wheel"); if(!c) return;
  const x = c.getContext("2d"), W=c.width, R=W/2-8, cs=getComputedStyle(document.documentElement);
  const navy=cs.getPropertyValue("--navy").trim(), cop=cs.getPropertyValue("--copper").trim(), copD=cs.getPropertyValue("--copper-deep").trim(), sunk=cs.getPropertyValue("--sunk").trim(), muted=cs.getPropertyValue("--muted").trim();
  x.clearRect(0,0,W,W);
  const L = wheelNames();
  x.save(); x.translate(W/2,W/2);
  if(!L.length){ x.beginPath(); x.arc(0,0,R,0,Math.PI*2); x.fillStyle=sunk; x.fill(); x.fillStyle=muted; x.font="600 28px 'IBM Plex Sans Arabic',sans-serif"; x.textAlign="center"; x.fillText("اختر المشاركين",0,10); x.restore(); return; }
  const seg = Math.PI*2/L.length;
    L.forEach((s,i)=>{
    x.beginPath(); x.moveTo(0,0); x.arc(0,0,R,wheelRot+i*seg,wheelRot+(i+1)*seg); x.closePath();
    x.fillStyle = (L.length>1 && L.length%2===1 && i===L.length-1) ? cop : (i%2?copD:navy);
    x.fill(); x.strokeStyle="rgba(255,255,255,.35)"; x.lineWidth=2; x.stroke();
    const ang = wheelRot+(i+.5)*seg, flip = Math.cos(ang) < 0;
    x.save(); x.rotate(flip ? ang+Math.PI : ang); x.textAlign = flip ? "left" : "right"; x.textBaseline="middle"; x.fillStyle="#fff";
    const label = short3(s.name), room = R-74;
    let fs = Math.max(18, Math.min(30, 300/L.length+10));
    x.font=`600 ${fs}px 'IBM Plex Sans Arabic',sans-serif`;
    while(x.measureText(label).width > room && fs > 13){ fs--; x.font=`600 ${fs}px 'IBM Plex Sans Arabic',sans-serif`; }
    x.fillText(label, flip ? -(R-22) : R-22, 0); x.restore();
  });
  x.beginPath(); x.arc(0,0,R,0,Math.PI*2); x.lineWidth=8; x.strokeStyle=cop; x.stroke();
  x.beginPath(); x.arc(0,0,34,0,Math.PI*2); x.fillStyle=navy; x.fill(); x.lineWidth=4; x.strokeStyle=cop; x.stroke();
  x.strokeStyle=cop; x.lineWidth=3.5; x.lineJoin="round"; x.lineCap="round";
  x.strokeRect(-14,-6,28,7); x.strokeRect(-11,1,22,14);
  x.beginPath(); x.moveTo(0,-6); x.lineTo(0,15); x.stroke();
  x.beginPath(); x.ellipse(-6,-10,6,3.5,.35,0,Math.PI*2); x.stroke();
  x.beginPath(); x.ellipse(6,-10,6,3.5,-.35,0,Math.PI*2); x.stroke();
  x.restore();
}
function spin(){
  const L = wheelNames(); if(!L.length || ui.spinning) return;
  const d = activeDay(); if(prizesOn(d).length>=MAX_PRIZES) return;
  ui.spinning = true; $('[data-act="spin"]').disabled = true;
  const idx = Math.floor(Math.random()*L.length), seg=Math.PI*2/L.length;
  const want = -Math.PI/2 - (idx+.5)*seg;
  const twoPi=Math.PI*2; let delta = ((want - wheelRot) % twoPi + twoPi) % twoPi;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const start=wheelRot, total = delta + (reduce?0:twoPi*6), dur = reduce?1:4200, t0=performance.now();
  const step = now => {
    const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,4);
    wheelRot = start + total*e; drawWheel();
    if(k<1) requestAnimationFrame(step); else finish(L[idx].id);
  };
  requestAnimationFrame(step);
  function finish(id){
    wheelRot %= twoPi;
    S.prizes[d] = [...prizesOn(d), id]; ui.wheelSel.delete(id); save(); ui.spinning=false;
    $("#modal").innerHTML = `<div class="modal" data-act="close"><div class="dlg" role="dialog" aria-modal="true"><div class="prize-big">${coin}<span class="muted">الجائزة ${prizesOn(d).length} من ${MAX_PRIZES}</span><b>${esc(stu(id).name)}</b><span class="muted">مبروك، دينار</span></div><button class="btn pri" data-act="close">تم</button></div></div>`;
    render();
  }
}

function addEyes(root){
  (root||document).querySelectorAll('input[type="password"]:not([data-eye])').forEach(inp=>{
    inp.dataset.eye = "1";
    const w = document.createElement("span"); w.className = "pw-wrap"; w.setAttribute("dir","ltr");
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b = document.createElement("button"); b.type = "button"; b.className = "eye"; b.setAttribute("aria-label","إظهار كلمة المرور"); b.innerHTML = EYE_OPEN;
    b.addEventListener("click", ()=>{ const show = inp.type==="password"; inp.type = show ? "text" : "password"; b.innerHTML = show ? EYE_SHUT : EYE_OPEN; b.setAttribute("aria-label", show ? "إخفاء كلمة المرور" : "إظهار كلمة المرور"); inp.focus(); });
    w.appendChild(b);
  });

new MutationObserver(()=>addEyes()).observe(document.documentElement, {childList:true, subtree:true});
function authMsg(err){
  const c = (err && err.code) || "";
  if(/wrong-password|invalid-credential|invalid-login/.test(c)) return "الرقم الحالي غير صحيح.";
  if(c.includes("weak-password")) return "الرقم ضعيف، استخدم ٦ أرقام.";
  if(c.includes("email-already-in-use")) return "هذا البريد مستخدم لحساب ثاني.";
  if(c.includes("invalid-email")) return "صيغة البريد غير صحيحة.";
  if(c.includes("too-many")) return "محاولات كثيرة، انتظر قليلاً ثم حاول.";
  if(c.includes("network")) return "تعذّر الاتصال، تأكد من الإنترنت.";
  if(c.includes("requires-recent-login")) return "سجّل خروج وادخل من جديد، ثم أعد المحاولة.";
  if(c.includes("operation-not-allowed")) return "تغيير البريد غير مفعّل في إعدادات Firebase.";
  return "تعذّرت العملية ("+c+").";
}
async function reauth(pw){
  const u = FB.auth.currentUser;
  await FB.reauthenticateWithCredential(u, FB.EmailAuthProvider.credential(u.email, pw));
  return u;
}

    try{ const u=await reauth(cur); await FB.verifyBeforeUpdateEmail(u, em); e.target.reset(); out.className="err ok"; out.textContent="أرسلنا رابط تأكيد إلى "+em+". افتحه لإتمام التغيير، ثم ادخل بالبريد الجديد."; }

document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.k && t.dataset.sid){
    const day = t.dataset.day || ui.recDay, sid = t.dataset.sid;
    const r = ensure(day, sid), k = t.dataset.k, f = t.dataset.f, i = +(t.dataset.i||0), key = sid+"|"+day+"|"+k;
    const arr = entries(r[k]).map(x=>Object.assign({},x));
    const wasNew = i >= arr.length;
    let x = wasNew ? {} : arr[i];
    if(f==="s"){ const v=parseInt(t.value,10); x = v?{s:v}:{}; }
    else if(f==="full"){ x.full = t.checked; if(t.checked){ delete x.f; delete x.t; } }
    else { const n=Q.c[x.s-1]||0; let v=parseInt(t.value,10); if(v){ v=Math.max(1,Math.min(n,v)); x[f]=v; } else delete x[f]; }
    if(wasNew){ if(x.s){ arr.push(x); if(ui.slots[key]) ui.slots[key]--; } }
    else if(x.s) arr[i] = x; else arr.splice(i,1);
    if(!arr.length) delete r[k]; else r[k] = arr.length===1 ? arr[0] : arr;
    if(!r.a && day===ui.recDay) r.a="p";
    if(day===ui.recDay) ui.editDue.add(sid);
    ui.open.add(sid); save();
    if((f==="f" || f==="t") && !wasNew){
      const c = t.closest(".rec-item")?.querySelector(".calc"), pg = pages1(x);
      if(c) c.innerHTML = pg ? `= <b class="pg">${fmtPages(pg)} وجه</b>` : "";
      if(x[f]!==undefined) t.value = x[f];
      const tot = t.closest(".fld")?.lastElementChild?.querySelector(".calc");
      if(tot) tot.innerHTML = entries(r[k]).length>1 ? `المجموع = <b class="pg">${fmtPages(pagesFor(r[k]))} وجه</b>` : "";
    } else {
      render();
      if(f==="s" && x.s){ const idx = wasNew ? entries(r[k]).length-1 : i; $(`#${k}f-${sid}-${day}-${idx}`)?.focus(); }
    }
    toast("حُفظ");
  }
  if(t.dataset.photo && t.files && t.files[0]){
    const sid = t.dataset.photo;
    compress(t.files[0], 360, .82).then(u=>{
      S.photos = S.photos||{}; S.photos[sid] = u; render();
      FB.setDoc(FB.doc(FB.db,"photos",sid), {img:u}).then(()=>{ save(); toast("حُفظت الصورة"); }).catch(err=>{ console.error(err); toast("تعذّر حفظ الصورة"); });
    }).catch(()=>toast("تعذّر قراءة الصورة"));
  }
  if(t.id==="gal-files" && t.files && t.files.length){ uploadGallery([...t.files]); }
  if(t.id==="ann-img" && t.files[0]){
    compress(t.files[0]).then(u=>{ if(u.length>900000){ toast("الصورة كبيرة، اختر صورة أصغر"); return; } ui.annImg=u; const p=$("#ann-prev"); p.src=u; p.hidden=false; const l=$('label[for="ann-img"]'); if(l) l.textContent="تغيير الصورة"; }).catch(()=>toast("تعذّر قراءة الصورة"));
  }
  if(t.dataset.info){
    const f=S.info, k=t.dataset.info;
    if(k==="cn") f.contacts[+t.dataset.i].n=t.value.trim();
    else if(k==="cp") f.contacts[+t.dataset.i].p=t.value.trim();
    else if(k==="rules") f.rules=t.value;
    else if(k==="start"){ f.start = t.value || DEFAULT_START; }
    else if(k==="iban"){ f.iban = t.value.replace(/\s/g,"").toUpperCase(); t.value = f.iban; }
    else if(k==="wa"){ const v=t.value.trim(); if(v && !/^https:\/\//.test(v)){ $("#wa-err").textContent="الرابط لازم يبدأ بـ https://"; return; } $("#wa-err").textContent=""; f.wa=v; }
    save(); toast("حُفظ");
  }
  if(t.dataset.actIn==="phone"){
    const s = stu(t.dataset.sid), v = normPhone(t.value), err = $("#iq-err") || {};
    if(v && !/^\d{8,12}$/.test(v)){ err.textContent = `رقم ولي أمر ${s.name.split(" ")[0]} غير صحيح، اكتب ٨ أرقام.`; return; }
    err.textContent = ""; s.phone = v; t.value = v; save();
    const sib = v ? S.students.filter(o=>o.id!==s.id && o.phone===v).length : 0;
    toast(sib ? `حُفظ الرقم (مشترك مع ${sib} من الإخوان)` : "حُفظ الرقم");
  }
  if(t.dataset.stu){
    const s = stu(t.dataset.sid), f = t.dataset.stu; let v = t.value.trim();
    if(f==="iqra") v = v.replace(/\D/g,"");
    if(f==="email" && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast("صيغة البريد غير صحيحة"); return; }
    s[f] = v; t.value = v; save(); toast("حُفظ");
  }
  if(t.dataset.rep){ if(t.dataset.rep==="from") ui.repFrom = t.value; else ui.repTo = t.value; render(); }
  if(t.dataset.note){ const r = ensure(t.dataset.day, t.dataset.note), v = t.value.trim(); if(v) r.note = v; else delete r.note; ui.open.add(t.dataset.note); save(); toast("حُفظت الملاحظة"); }
  if(t.dataset.tname){ const x = (S.teachers||[]).find(y=>y.id===t.dataset.tname), v = t.value.trim(); if(x && v){ x.name = v; save(); toast("حُفظ"); } }
  if(t.dataset.actIn==="name"){ const s=stu(t.dataset.sid); const v=t.value.trim(); if(v){ s.name=v; save(); toast("حُفظ الاسم"); } }
  if(t.dataset.actIn==="iqra"){
    const s=stu(t.dataset.sid); const v=t.value.replace(/\D/g,"");
    const err=$("#iq-err");
    if(v && v.length!==8){ err.textContent=`رقم ${s.name.split(" ")[0]} لازم يكون ٨ أرقام.`; return; }
    if(v && S.students.some(o=>o.id!==s.id && o.iqra===v)){ err.textContent="هذا الرقم مسجّل لطالب آخر."; return; }
    err.textContent=""; s.iqra=v; t.value=v; save(); toast("حُفظ الرقم");
  }
});

    const m = t.match(/const BUILD = "(\d+)"/); if(!m || m[1]===BUILD) return;
    if(saveT || inFlight) return;
    let tried = ""; try { tried = sessionStorage.getItem(KEY+":upd")||""; } catch(e){}
    if(tried===m[1]) return;
    try { sessionStorage.setItem(KEY+":upd", m[1]); } catch(e){}
    fetch(location.pathname, {cache:"reload"}).finally(()=>location.reload());
  }).catch(()=>{});
  setTimeout(run, 2500);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") run(); });
})();
